services:
  redis:
    image: redis:7-alpine
    container_name: portfolio-redis
    restart: unless-stopped
    # Fortune v2 makes Redis correctness-critical (event streams + run state).
    # maxmemory below the 128M container limit so pressure surfaces as
    # noeviction write errors (visible as redis_publish_failed runs), not
    # a container OOM-kill.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction", "--maxmemory", "100mb"]
    volumes:
      - redis_data:/data
    networks:
      - portfolio-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio-backend
    restart: unless-stopped
    ports:
      - "8100:8000"
    env_file:
      - ./backend/.env.production
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      # Homer playable-architecture bridge lives on the Mac host (127.0.0.1:3012).
      # Secrets (HOMER_PUBLIC_BRIDGE_SECRET, HOMER_PLAY_IP_SECRET) come from
      # .env.production, never from this file.
      - HOMER_PUBLIC_BRIDGE_URL=http://host.docker.internal:3012
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./public:/public:ro
      - ./.claude/skills:/.claude/skills:ro
      # Gmail OAuth creds for booking emails (credentials.json + sibling
      # gcp-oauth.keys.json for token refresh). Read-only; token write-back
      # failures are non-fatal (logged warning only).
      - /Users/yj/.gmail-mcp:/secrets/gmail:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - portfolio-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          # The backend runs one gunicorn worker because fortune runs are
          # worker-owned: the publisher task lives in the worker that accepted
          # /create and dies with it (see the DEBT marker in fortune/routes.py;
          # upgrade path is a Redis consumer-group runner service). CPU headroom
          # still benefits calculations and concurrent async requests.
          memory: 4G
          cpus: "8.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:

networks:
  portfolio-net:
    driver: bridge
