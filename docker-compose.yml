services:
  redis:
    image: redis:7-alpine
    container_name: portfolio-redis
    restart: unless-stopped
    # Fortune v2 makes Redis correctness-critical (event streams + run state).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    networks:
      - portfolio-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio-backend
    restart: unless-stopped
    ports:
      - "8100:8000"
    env_file:
      - ./backend/.env.production
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    volumes:
      - ./public:/public:ro
      - ./.claude/skills:/.claude/skills:ro
      # Gmail OAuth creds for booking emails (credentials.json + sibling
      # gcp-oauth.keys.json for token refresh). Read-only; token write-back
      # failures are non-fatal (logged warning only).
      - /Users/yj/.gmail-mcp:/secrets/gmail:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - portfolio-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          # The backend runs one gunicorn worker because active Fortune streams
          # use process-local state. CPU headroom still benefits calculations
          # and concurrent async requests within that worker.
          memory: 4G
          cpus: "8.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:

networks:
  portfolio-net:
    driver: bridge
