services:
  redis:
    image: redis:7-alpine
    container_name: portfolio-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - portfolio-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio-backend
    restart: unless-stopped
    ports:
      - "8100:8000"
    env_file:
      - ./backend/.env.production
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    volumes:
      - ./public:/public:ro
      - ./.claude/skills:/.claude/skills:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - portfolio-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          # PR-Infra (2026-05-10): lifted from 1G/2 CPUs to 4G/8 CPUs.
          # Mac Mini has 12 CPUs / 24 GB total (Docker engine sees 12 CPUs
          # / 7.65 GB). At 2 CPUs we were using ~17% of Docker's CPU
          # slice while OpenAI API latency was the demo bottleneck — wasted
          # headroom. 6 gunicorn workers × ~600 MB Python footprint fits
          # comfortably under 4G; the extra cores absorb concurrent demo
          # sessions during portfolio walkthroughs.
          memory: 4G
          cpus: "8.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:

networks:
  portfolio-net:
    driver: bridge
