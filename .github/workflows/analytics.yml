name: Analytics Verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**'
      - 'components/analytics/**'
      - 'frontend/tests/playwright/**'
      - 'docs/**'
      - 'examples/prompts/**'
      - '.github/workflows/analytics.yml'

env:
  # Toggle via repo/org variable or workflow dispatch input to enable Playwright job.
  # Example: gh workflow run analytics.yml --ref main -f PLAYWRIGHT_ANALYTICS=1
  PLAYWRIGHT_ANALYTICS: ${{ vars.PLAYWRIGHT_ANALYTICS || '0' }}

jobs:
  backend-analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run analytics pytest suite
        run: |
          python -m pytest backend/tests/analytics/test_prompt_contracts.py backend/tests/analytics/test_async_reuse_flow.py

  frontend-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run targeted vitest suites
        run: |
          npm test -- components/analytics/common/__tests__/ProcessPanel.finalAnswer.test.tsx
          npm test -- components/analytics/common/__tests__/ProcessPanelCsv.export.test.ts

  playwright-analytics:
    runs-on: ubuntu-latest
    needs: frontend-unit
    if: env.PLAYWRIGHT_ANALYTICS == '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run analytics reuse Playwright spec
        run: npx playwright test frontend/tests/playwright/analytics/agentic-reuse.spec.ts
