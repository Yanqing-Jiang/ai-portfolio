name: Agentic Smoke

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      run_live:
        description: 'Also run live smoke suite against the staging backend'
        required: false
        default: false
        type: boolean

env:
  SMOKE_BACKEND_URL: ${{ secrets.AGENTIC_SMOKE_BACKEND_URL }}
  SMOKE_FLOW: ${{ vars.AGENTIC_SMOKE_FLOW || 'single-agent' }}
  SMOKE_SUPERVISOR_FLOW: ${{ vars.AGENTIC_SUPERVISOR_FLOW || 'multi-agent' }}

jobs:
  fixtures:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run agentic smoke (fixtures)
        shell: pwsh
        run: |
          if (Test-Path reports/agentic_smoke) {
            Get-ChildItem reports/agentic_smoke -Recurse -File | Where-Object { $_.FullName -notlike '*\fixtures\*' } | Remove-Item -Force -ErrorAction SilentlyContinue
            Get-ChildItem reports/agentic_smoke -Recurse -Directory | Where-Object { $_.FullName -notmatch '\\fixtures$' } | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }
          ./scripts/agentic_smoke_test.ps1 -Flow $env:SMOKE_FLOW -FixtureDirectory reports/agentic_smoke/fixtures -SupervisorFlow $env:SMOKE_SUPERVISOR_FLOW

      - name: Show snapshot archives (fixtures)
        if: always()
        shell: pwsh
        run: |
          if (Test-Path reports/agentic_smoke) {
            Get-ChildItem reports/agentic_smoke -Filter '*snapshot.json' -Recurse | Select-Object -ExpandProperty FullName
          } else {
            Write-Host 'No snapshot artifacts produced.'
          }

      - name: Upload smoke artifacts (fixtures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentic-smoke-fixtures
          path: reports/agentic_smoke

  live:
    needs: fixtures
    runs-on: windows-latest
    if: >-
      ${{ env.SMOKE_BACKEND_URL != '' &&
          (github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' && github.event.inputs.run_live == 'true')) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run agentic smoke (live backend)
        shell: pwsh
        env:
          BACKEND_URL: ${{ env.SMOKE_BACKEND_URL }}
          FLOW_MODE: ${{ env.SMOKE_FLOW }}
        run: |
          if (-not $env:BACKEND_URL) {
            throw 'BACKEND_URL is not configured; set AGENTIC_SMOKE_BACKEND_URL secret to enable live runs.'
          }
          if (Test-Path reports/agentic_smoke) {
            Get-ChildItem reports/agentic_smoke -Recurse -File | Where-Object { $_.FullName -notlike '*\fixtures\*' } | Remove-Item -Force -ErrorAction SilentlyContinue
            Get-ChildItem reports/agentic_smoke -Recurse -Directory | Where-Object { $_.FullName -notmatch '\\fixtures$' } | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }
          ./scripts/agentic_smoke_test.ps1 -Flow $env:FLOW_MODE -BackendUrl $env:BACKEND_URL -SupervisorFlow $env:SMOKE_SUPERVISOR_FLOW

      - name: Show snapshot archives (live)
        if: always()
        shell: pwsh
        run: |
          if (Test-Path reports/agentic_smoke) {
            Get-ChildItem reports/agentic_smoke -Filter '*snapshot.json' -Recurse | Select-Object -ExpandProperty FullName
          } else {
            Write-Host 'No snapshot artifacts produced.'
          }

      - name: Upload smoke artifacts (live)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentic-smoke-live
          path: reports/agentic_smoke
