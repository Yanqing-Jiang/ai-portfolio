      - "vs industry average"
      - "compare to industry"
      - "vs peers growth"
    sql_template: |
      WITH quarterly_revenue AS (
        SELECT 
          ticker,
          calendar_year,
          calendar_quarter_num,
          calendar_quarter,
          SUM(value) AS quarterly_revenue,
          calendar_year * 100 + calendar_quarter_num AS period_id
        FROM comp_financials
        WHERE 
          metric = 'Revenue'
