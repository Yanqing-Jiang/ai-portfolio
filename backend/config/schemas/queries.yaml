  operating_leverage_yoy_vs_peers:
    name: "Operating Leverage vs Peers"
    description: "Compare year-over-year operating leverage against the peer average"
    keywords:
      - "operating leverage"
      - "leverage vs peers"
      - "operating leverage yoy"
      - "operating leverage industry"
      - "operating leverage compare"
    sql_template: |
      WITH annual AS (
        SELECT
          ticker,
          calendar_year,
          SUM(CASE WHEN metric = 'Revenue' THEN value ELSE 0 END) AS revenue,
          SUM(CASE WHEN metric = 'Operating Income' THEN value ELSE 0 END) AS operating_income
        FROM comp_financials
        WHERE
          metric IN ('Revenue','Operating Income')
          AND ticker IN ('AMD','AVGO','INTC','MU','NVDA','QCOM','TXN')
          AND calendar_year >= EXTRACT(YEAR FROM CURRENT_DATE) - {years_back}
        GROUP BY ticker, calendar_year
      ),
      growth AS (
        SELECT
          ticker,
          calendar_year,
          revenue,
          operating_income,
          LAG(revenue) OVER (PARTITION BY ticker ORDER BY calendar_year) AS revenue_prev,
          LAG(operating_income) OVER (PARTITION BY ticker ORDER BY calendar_year) AS operating_income_prev
        FROM annual
      ),
      leverage AS (
        SELECT
          ticker,
          calendar_year,
          revenue,
          operating_income,
          CASE
            WHEN revenue_prev IS NULL OR revenue_prev = 0 THEN NULL
            ELSE (revenue - revenue_prev) / NULLIF(ABS(revenue_prev), 0)
          END AS revenue_yoy_growth,
          CASE
            WHEN operating_income_prev IS NULL OR operating_income_prev = 0 THEN NULL
            ELSE (operating_income - operating_income_prev) / NULLIF(ABS(operating_income_prev), 0)
          END AS operating_income_yoy_growth
        FROM growth
      ),
      leverage_ratios AS (
        SELECT
          ticker,
          calendar_year,
          revenue,
          operating_income,
          revenue_yoy_growth,
          operating_income_yoy_growth,
          CASE
            WHEN revenue_yoy_growth IS NULL OR revenue_yoy_growth = 0 THEN NULL
            ELSE operating_income_yoy_growth / revenue_yoy_growth
          END AS operating_leverage
        FROM leverage
      ),
      peer_average AS (
        SELECT
          calendar_year,
          AVG(operating_leverage) FILTER (WHERE ticker <> '{target_ticker}' AND operating_leverage IS NOT NULL) AS peer_avg_operating_leverage,
          AVG(operating_income_yoy_growth) FILTER (WHERE ticker <> '{target_ticker}' AND operating_income_yoy_growth IS NOT NULL) AS peer_avg_operating_income_yoy,
          AVG(revenue_yoy_growth) FILTER (WHERE ticker <> '{target_ticker}' AND revenue_yoy_growth IS NOT NULL) AS peer_avg_revenue_yoy
        FROM leverage_ratios
        GROUP BY calendar_year
      )
      SELECT
        lr.calendar_year,
        lr.ticker,
        lr.revenue,
        lr.operating_income,
        lr.revenue_yoy_growth,
        lr.operating_income_yoy_growth,
        lr.operating_leverage,
        pa.peer_avg_operating_leverage,
        pa.peer_avg_operating_income_yoy,
        pa.peer_avg_revenue_yoy
      FROM leverage_ratios lr
      LEFT JOIN peer_average pa ON pa.calendar_year = lr.calendar_year
      WHERE lr.ticker = '{target_ticker}'
      ORDER BY lr.calendar_year
      LIMIT 500;

  eps_yoy_rank_latest:
    name: "EPS YoY Leaderboard (Latest Quarter)"
    description: "Rank peer EPS Basic year-over-year growth for the most recent reported quarter"
    keywords:
      - "eps yoy"
      - "eps growth rank"
      - "who leads eps"
      - "eps leaderboard"
      - "rank eps yoy"
    sql_template: |
      WITH latest_period AS (
        SELECT MAX(calendar_year * 10 + calendar_quarter_num) AS period_key
        FROM comp_financials
        WHERE
          metric = 'EPS Basic'
          AND ticker IN ('AMD','AVGO','INTC','MU','NVDA','QCOM','TXN')
          AND calendar_quarter_num IS NOT NULL
      ),
      eps_quarters AS (
        SELECT
          ticker,
          calendar_year,
          calendar_quarter_num,
          calendar_quarter,
          AVG(value) AS eps_basic
        FROM comp_financials
        WHERE
          metric = 'EPS Basic'
          AND ticker IN ('AMD','AVGO','INTC','MU','NVDA','QCOM','TXN')
          AND calendar_quarter_num IS NOT NULL
          AND calendar_year >= EXTRACT(YEAR FROM CURRENT_DATE) - 5
        GROUP BY ticker, calendar_year, calendar_quarter_num, calendar_quarter
      ),
      with_lag AS (
        SELECT
          eq.*,
          LAG(eq.eps_basic, 4) OVER (
            PARTITION BY ticker
            ORDER BY calendar_year, calendar_quarter_num
          ) AS eps_basic_prev_year
        FROM eps_quarters eq
      ),
      latest AS (
        SELECT wl.*
        FROM with_lag wl
        JOIN latest_period lp
          ON (wl.calendar_year * 10 + wl.calendar_quarter_num) = lp.period_key
      )
      SELECT
        ticker,
        calendar_year,
        calendar_quarter_num,
        calendar_quarter,
        eps_basic,
        eps_basic_prev_year,
        CASE
          WHEN eps_basic_prev_year IS NULL OR eps_basic_prev_year = 0 THEN NULL
          ELSE (eps_basic - eps_basic_prev_year) / NULLIF(ABS(eps_basic_prev_year), 0)
        END AS eps_yoy_growth_pct
      FROM latest
      ORDER BY eps_yoy_growth_pct DESC NULLS LAST, ticker
      LIMIT 50;

  capex_intensity_latest_rank:
    name: "CapEx Intensity Leaderboard (Latest Quarter)"
    description: "Rank capital expenditure intensity (CapEx / Revenue) for the most recent quarter"
    keywords:
      - "capex intensity"
      - "capital intensity"
      - "capex rank"
      - "capital intensive"
      - "capex leaderboard"
    sql_template: |
      WITH latest_period AS (
        SELECT MAX(calendar_year * 10 + calendar_quarter_num) AS period_key
        FROM comp_financials
        WHERE
          metric IN ('Capital Expenditures','Revenue')
          AND ticker IN ('AMD','AVGO','INTC','MU','NVDA','QCOM','TXN')
          AND calendar_quarter_num IS NOT NULL
      ),
      quarterly AS (
        SELECT
          ticker,
          calendar_year,
          calendar_quarter_num,
          calendar_quarter,
          SUM(CASE WHEN metric = 'Capital Expenditures' THEN value ELSE 0 END) AS capex,
          SUM(CASE WHEN metric = 'Revenue' THEN value ELSE 0 END) AS revenue
        FROM comp_financials
        WHERE
          metric IN ('Capital Expenditures','Revenue')
          AND ticker IN ('AMD','AVGO','INTC','MU','NVDA','QCOM','TXN')
          AND calendar_quarter_num IS NOT NULL
          AND calendar_year >= EXTRACT(YEAR FROM CURRENT_DATE) - 3
        GROUP BY ticker, calendar_year, calendar_quarter_num, calendar_quarter
      ),
      latest AS (
        SELECT q.*
        FROM quarterly q
        JOIN latest_period lp
          ON (q.calendar_year * 10 + q.calendar_quarter_num) = lp.period_key
      )
      SELECT
        ticker,
        calendar_year,
        calendar_quarter_num,
        calendar_quarter,
        capex,
        revenue,
        CASE
          WHEN revenue = 0 THEN NULL
          ELSE capex / revenue
        END AS capex_intensity_ratio
      FROM latest
      ORDER BY capex_intensity_ratio DESC NULLS LAST, ticker
      LIMIT 50;

  rnd_intensity_vs_peers:
    name: "R&D Intensity vs Industry Average"
    description: "Compare R&D spending intensity against industry average"
    keywords: 
      - "r&d"
      - "research and development"
      - "r&d intensity"
      - "r&d spending"
      - "r&d expense"
      - "industry average"
      - "average"
      - "mean"
      - "compare to average"
      - "vs average"
      
    sql_template: |
      WITH quarterly_data AS (
        SELECT 
          ticker,
          calendar_year,
          calendar_quarter_num,
          metric,
          value
        FROM comp_financials
        WHERE 
          calendar_quarter_num IS NOT NULL
          AND ticker IN ('AMD','AVGO','INTC','MU','NVDA','QCOM','TXN')
          AND metric IN ('Revenue', 'R&D Expense')
          AND calendar_year >= EXTRACT(YEAR FROM CURRENT_DATE) - {years_back}
          AND value IS NOT NULL
      ),
      annual_aggregates AS (
        SELECT 
          ticker,
          calendar_year,
          SUM(CASE WHEN metric = 'Revenue' THEN value END) AS revenue,
          SUM(CASE WHEN metric = 'R&D Expense' THEN value END) AS rnd_expense
        FROM quarterly_data
        GROUP BY ticker, calendar_year
        HAVING SUM(CASE WHEN metric = 'Revenue' THEN value END) > 0
      ),
      rnd_intensity AS (
        SELECT 
          ticker,
          calendar_year,
          revenue,
          rnd_expense,
          (rnd_expense / revenue) * 100.0 AS rnd_intensity_percent
        FROM annual_aggregates
        WHERE revenue > 0 AND rnd_expense IS NOT NULL
      ),
      peer_benchmarks AS (
        SELECT 
          calendar_year,
          AVG(CASE WHEN ticker != '{target_ticker}' THEN rnd_intensity_percent END) AS peer_avg_rnd_intensity
        FROM rnd_intensity
        GROUP BY calendar_year
      )
      SELECT 
        ri.calendar_year,
        ri.ticker,
        ri.revenue,
        ri.rnd_expense,
        ri.rnd_intensity_percent AS company_rnd_intensity,
        pb.peer_avg_rnd_intensity,
        ri.rnd_intensity_percent - pb.peer_avg_rnd_intensity AS rnd_intensity_vs_peers
      FROM rnd_intensity ri
      JOIN peer_benchmarks pb ON ri.calendar_year = pb.calendar_year
      WHERE ri.ticker = '{target_ticker}'
      ORDER BY ri.calendar_year
      LIMIT 500;

  rnd_expense_vs_peers:
    name: "R&D Expense vs Industry Average"
    description: "Compare absolute R&D expense against peer average"
    keywords:
      - "r&d expense"
      - "rnd expense"
      - "research and development expense"
      - "expense vs average"
      - "expense compare"
      - "spending vs average"
      - "spending compare"
      - "industry average"
      - "vs peers"
      - "compare"
    sql_template: |
      WITH q AS (
        SELECT * FROM comp_financials
        WHERE calendar_quarter_num IS NOT NULL
          AND ticker IN ('AMD','AVGO','INTC','MU','NVDA','QCOM','TXN')
          AND metric IN ('R&D Expense')
          AND calendar_year >= EXTRACT(YEAR FROM CURRENT_DATE) - {years_back}
      ), yr AS (
        SELECT
          ticker,
          calendar_year,
          SUM(value) AS rnd_expense
        FROM q
        GROUP BY ticker, calendar_year
      ), peer_avg AS (
        SELECT
          calendar_year,
          AVG(CASE WHEN ticker <> '{target_ticker}' THEN rnd_expense END) AS peer_avg_rnd_expense
        FROM yr
        GROUP BY calendar_year
      )
      SELECT
        y.calendar_year,
        '{target_ticker}'::text AS ticker,
        y.rnd_expense AS company_rnd_expense,
        p.peer_avg_rnd_expense
      FROM yr y
      JOIN peer_avg p USING (calendar_year)
      WHERE y.ticker = '{target_ticker}'
      ORDER BY y.calendar_year
      LIMIT 500;

  rnd_top_spender:
    name: "R&D Top Spender"
    description: "Identify the company with the highest R&D expense for a selected year"
    keywords:
      - "highest r&d spending"
      - "top r&d spender"
      - "largest r&d expense"
      - "most r&d investment"
      - "highest research spending"
    sql_template: |
      WITH annual AS (
        SELECT
          ticker,
          calendar_year,
          SUM(CASE WHEN metric = 'R&D Expense' THEN value ELSE 0 END) AS rnd_spending,
          SUM(CASE WHEN metric = 'Revenue' THEN value ELSE 0 END) AS revenue
        FROM comp_financials
        WHERE
          metric IN ('R&D Expense','Revenue')
          AND ticker IN ('AMD','AVGO','INTC','MU','NVDA','QCOM','TXN')
          AND calendar_year >= COALESCE({start_year}, EXTRACT(YEAR FROM CURRENT_DATE) - {years_back})
          AND ({end_year} IS NULL OR calendar_year <= {end_year})
        GROUP BY ticker, calendar_year
      ),
      ranked AS (
        SELECT
          calendar_year,
          ticker,
          rnd_spending,
          revenue,
          CASE WHEN revenue = 0 THEN NULL ELSE (rnd_spending / revenue) * 100 END AS rnd_intensity_pct,
          RANK() OVER (PARTITION BY calendar_year ORDER BY rnd_spending DESC NULLS LAST) AS rnd_rank
        FROM annual
      )
      SELECT
        calendar_year,
        ticker,
        rnd_spending,
        revenue,
        rnd_intensity_pct,
        rnd_rank
      FROM ranked
      WHERE rnd_rank <= 5
      ORDER BY calendar_year DESC, rnd_rank ASC
      LIMIT 500;
    single_year_template: |
      WITH annual AS (
        SELECT
          ticker,
          calendar_year,
          SUM(CASE WHEN metric = 'R&D Expense' THEN value ELSE 0 END) AS rnd_spending,
          SUM(CASE WHEN metric = 'Revenue' THEN value ELSE 0 END) AS revenue
        FROM comp_financials
        WHERE
          metric IN ('R&D Expense','Revenue')
          AND ticker IN ('AMD','AVGO','INTC','MU','NVDA','QCOM','TXN')
          AND calendar_year = {start_year}
        GROUP BY ticker, calendar_year
      ),
      ranked AS (
        SELECT
          calendar_year,
          ticker,
          rnd_spending,
          revenue,
          CASE WHEN revenue = 0 THEN NULL ELSE (rnd_spending / revenue) * 100 END AS rnd_intensity_pct,
          RANK() OVER (ORDER BY rnd_spending DESC NULLS LAST) AS rnd_rank
        FROM annual
      )
      SELECT
        calendar_year,
        ticker,
        rnd_spending,
        revenue,
        rnd_intensity_pct,
        rnd_rank
      FROM ranked
      ORDER BY rnd_rank ASC
      LIMIT 10;
    single_year_description: "Top R&D spenders for a specific fiscal year with intensity context"

# Template variables
template_variables:
  default_companies: ["AMD", "AVGO", "INTC", "MU", "NVDA", "QCOM", "TXN"]
  default_years_back: 5
  default_target_ticker: "NVDA"


