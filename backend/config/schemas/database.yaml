# Database Schema Configuration
tables:
  comp_financials:
    name: "comp_financials"
    description: "Semiconductor company financial metrics in long format"
    type: "long_format"  # Each row is one metric value
    
    columns:
      - name: "ticker"
        type: "string"
        description: "Company stock ticker symbol"
        required: true
        indexed: true
        
      - name: "metric"
        type: "string"
        description: "Financial metric name (exact match required)"
        required: true
        indexed: true
        
      - name: "value"
        type: "float"
        description: "Metric value in millions USD (except ratios)"
        required: true
        nullable: true  # Some metrics may have null values
        
      - name: "tag_used"
        type: "string"
        description: "Source tag or identifier"
        required: false
        
      - name: "date"
        type: "date"
        description: "Reporting date"
        required: false
        
      - name: "calendar_year"
        type: "integer"
        description: "Calendar year (e.g., 2023)"
        required: true
        indexed: true
        
      - name: "calendar_quarter_num"
        type: "integer"
        description: "Quarter number (1, 2, 3, 4, or NULL for annual)"
        required: false
        indexed: true
        
      - name: "calendar_quarter"
        type: "string"
        description: "Quarter label (Q1, Q2, Q3, Q4, or NULL for annual)"
        required: false
        
    # Primary indexes for performance
    indexes:
      - name: "idx_ticker_metric_year_quarter"
        columns: ["ticker", "metric", "calendar_year", "calendar_quarter_num"]
        type: "btree"
        
      - name: "idx_metric_year"
        columns: ["metric", "calendar_year"]
        type: "btree"
        
      - name: "idx_ticker_year"
        columns: ["ticker", "calendar_year"]
        type: "btree"
        
    # Column mappings for queries
    time_columns:
      year: "calendar_year"
      quarter: "calendar_quarter_num"
      quarter_label: "calendar_quarter"
      date: "date"
      
    value_column: "value"
    entity_column: "ticker"
    metric_column: "metric"
    
# Query configuration
query_defaults:
  default_limit: 500
  max_limit: 10000
  default_years_back: 5
  max_years_back: 10
  
  # Time period filters
  annual_filter: "calendar_quarter_num IS NULL"
  quarterly_filter: "calendar_quarter_num IS NOT NULL"
  
  # Common WHERE clauses
  active_companies_filter: "ticker IN ({company_list})"
  recent_data_filter: "calendar_year >= EXTRACT(YEAR FROM CURRENT_DATE) - {years_back}"
  
  # Performance settings
  statement_timeout: "15s"
  work_mem: "256MB"
  
# Data quality rules
data_validation:
  required_metrics:
    - "Revenue"
    - "Net Income"
    - "Total Assets"
    
  value_ranges:
    currency_metrics:
      min: -1000000  # -1B USD
      max: 1000000   # 1B USD
      
    ratio_metrics:
      min: -10.0
      max: 10.0
      
  time_bounds:
    min_year: 2010
    max_year: 2030
    
# Aggregation rules
aggregation:
  quarterly_to_annual:
    sum_metrics:
      - "Revenue"
      - "Net Income"
      - "Operating Income"
      - "Gross Profit"
      - "R&D Expense"
      - "SG&A"
      - "CapEx"
      - "CFO"
      - "CFI"
      - "CFF"
      
    last_metrics:  # Take last quarter value for these
      - "Total Assets"
      - "Cash & Equiv."
      - "Total Liabilities"
      - "Stockholders' Equity"
      
    average_metrics:  # Average across quarters
      - "Wtd Avg Shares Basic"
      - "Wtd Avg Shares Diluted"