# Render.com Deployment Configuration
# This file enables Infrastructure-as-Code deployment for the AI Portfolio
#
# Deploy: Push to GitHub, then connect repo to Render and it will auto-detect this file
# Docs: https://render.com/docs/blueprint-spec

services:
  # Backend API Service (Python + Claude SDK)
  - type: web
    name: ai-portfolio-backend
    runtime: python
    region: ohio  # Change to your preferred region
    plan: free  # Use 'starter' or higher for production
    rootDir: backend
    
    # Build command: Python deps only (claude-code removed — saves ~15-20s per deploy)
    buildCommand: pip install -r requirements.txt

    # Start command: gunicorn with uvicorn workers for better concurrency
    startCommand: gunicorn main:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120

    # Health check endpoint (lightweight JSON, not /docs which renders Swagger UI)
    healthCheckPath: /health
    
    # Environment variables
    envVars:
      # Pin Python version (3.14 breaks langchain/pydantic type annotations)
      - key: PYTHON_VERSION
        value: 3.12.8

      # Required: Set your Claude API key in Render dashboard
      - key: CLAUDE_API_KEY
        sync: false  # Will prompt to set manually
      
      # Python path for imports (backend directory)
      - key: PYTHONPATH
        value: /opt/render/project/src/backend
      
      # Optional: Supabase connection (set in dashboard if using)
      - key: SUPABASE_DB_URL
        sync: false

  # Frontend Static Site (Vite/React)
  - type: web
    name: ai-portfolio-frontend
    runtime: static
    region: ohio
    plan: free
    
    # Build Vite app
    buildCommand: npm install && npm run build
    
    # Serve from dist folder
    staticPublishPath: dist
    
    # SPA routing: redirect all paths to index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    
    envVars:
      # Backend API URL (set after backend deploys)
      - key: VITE_API_URL
        sync: false
