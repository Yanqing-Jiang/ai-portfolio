# Render.com Deployment Configuration
# This file enables Infrastructure-as-Code deployment for the AI Portfolio
#
# Deploy: Push to GitHub, then connect repo to Render and it will auto-detect this file
# Docs: https://render.com/docs/blueprint-spec

services:
  # Backend API Service (Python + Claude SDK)
  - type: web
    name: ai-portfolio-backend
    runtime: python
    region: ohio  # Change to your preferred region
    plan: free  # Use 'starter' or higher for production
    rootDir: backend
    
    # Build command: Install Claude Code CLI globally, then Python deps
    # Render's Python runtime includes Node.js/npm pre-installed
    buildCommand: npm install -g @anthropic-ai/claude-code && pip install -r requirements.txt
    
    # Start command for FastAPI
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    
    # Health check endpoint
    healthCheckPath: /docs
    
    # Environment variables
    envVars:
      # Required: Set your Anthropic API key in Render dashboard
      - key: ANTHROPIC_API_KEY
        sync: false  # Will prompt to set manually
      
      # Optional: Enable SDK flow (set to 'true' to use Claude CLI)
      - key: USE_SDK_FLOW
        value: "true"
      
      # Python path for imports
      - key: PYTHONPATH
        value: /opt/render/project/src/backend
      
      # Optional: Supabase connection (set in dashboard if using)
      - key: SUPABASE_DB_URL
        sync: false

  # Frontend Static Site (Vite/React)
  - type: web
    name: ai-portfolio-frontend
    runtime: static
    region: ohio
    plan: free
    
    # Build Vite app
    buildCommand: npm install && npm run build
    
    # Serve from dist folder
    staticPublishPath: dist
    
    # SPA routing: redirect all paths to index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    
    envVars:
      # Backend API URL (set after backend deploys)
      - key: VITE_API_URL
        sync: false
